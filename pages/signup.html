<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password (min 6 characters)" required minlength="6">
      <input type="url" id="linkedin" placeholder="LinkedIn URL (https://...)" required>
      <input type="url" id="github" placeholder="GitHub URL (https://...)" required>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>
  <script type="module" src="../js/signup.js"></script>
</body>
</html>
